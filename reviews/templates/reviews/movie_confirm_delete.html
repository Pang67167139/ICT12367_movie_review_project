{% extends "reviews/base.html" %}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <legend class="border-bottom mb-4">ลบภาพยนตร์</legend>
            <h2>คุณแน่ใจหรือไม่ว่าต้องการลบภาพยนตร์ "{{ object.title }}"?</h2>
        </fieldset>
        <div class="form-group">
            <button class="btn btn-outline-danger" type="submit">ใช่ ลบ</button>
            <a class="btn btn-outline-secondary" href="{% url 'movie-detail' object.id %}">ยกเลิก</a>
        </div>
    </form>
</div>
{% endblock content %}
